# Waydog.toml - Various distro default fallback settings. Use this
# file for permanent additions like hooks, and consider editing
# ~/.local/share/noctalia/settings.toml first if the settings
# dialog doesn't offer what you need.

[shell]
setup_wizard_enabled = false

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"
command = "noctalia-logout"

[[shell.session.actions]]
action = "suspend"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"

[theme]
wallpaper_scheme = "vibrant"
source = "custom"
custom_palette = "Dragon"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt" ]

    [theme.templates.user.labwc]
    input_path  = "$XDG_CONFIG_HOME/noctalia/templates/labwc-themerc"
    output_path = "~/.local/share/themes/waydog/openbox-3/themerc"
    post_hook   = "restore-dragon"

[wallpaper]
directory = "/usr/share/backgrounds/wallpapers"

    [wallpaper.default]
    path = "/usr/share/backgrounds/wallpapers/Default.jpg"

[bar.default]
start  = ["launcher", "hotcorners", "wallpaper", "workspaces", "taskbar"]
center = []
end    = ["tray", "notifications", "clipboard", "bluetooth", "volume", "brightness", "battery", "clock", "network", "control-center", "session"]

[widget.hotcorners]
type = "custom_button"
glyph = "scan-eye"
tooltip = "Hotcorners: Left-Click ▸ toggle on/off Right-Click ▸ settings"

    [widget.hotcorners.actions]
    left = "exec hotcorners-toggle"
    right = "exec noctalia msg settings-open desktop"

[hot_corners]
enabled = false

    [hot_corners.bottom_left]
    action = "command"
    command = "x-terminal-emulator"

    [hot_corners.bottom_right]
    action = "command"
    command = "ld-logout"

    [hot_corners.top_left]
    action = "command"
    command = "thunar"

    [hot_corners.top_right]
    action = "command"
    command = "geany"

[hooks]
wallpaper_changed = 'mkdir -p "$HOME/.cache/waydog" && printf "%s\n" "$NOCTALIA_WALLPAPER_PATH" > "$HOME/.cache/waydog/wallpaper"'
colors_changed = 'sleep 0.2; d="$HOME/.config/gtk-3.0"; cat "$d/noctalia.css" "$d/waydog-colors.css" > "$d/colors.css.tmp" && mv -f "$d/colors.css.tmp" "$d/colors.css"'
started = "ghostty-noctalia-fix &"
