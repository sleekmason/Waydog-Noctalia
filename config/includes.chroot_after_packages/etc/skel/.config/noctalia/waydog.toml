# Waydog.toml - Various distro default fallback settings. Use this
# file for permanent additions like hooks, and consider editing
# ~/.local/state/noctalia/settings.toml first if the settings
# dialog doesn't offer what you need.

[shell]
setup_wizard_enabled = false

[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"
command = "noctalia-logout"

[[shell.session.actions]]
action = "suspend"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"

[theme]
wallpaper_scheme = "vibrant"
source = "custom"
custom_palette = "Dragon"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt" ]

    [theme.templates.user.labwc]
    input_path  = "$XDG_CONFIG_HOME/noctalia/templates/labwc-themerc"
    output_path = "~/.local/share/themes/waydog/openbox-3/themerc"
    post_hook   = "restore-dragon"

    [theme.templates.user.waydog-gtk3]
    input_path  = "$XDG_CONFIG_HOME/noctalia/templates/waydog-gtk3.css"
    output_path = "$XDG_CONFIG_HOME/gtk-3.0/waydog-colors.css"

    [theme.templates.user.waydog-gtk4]
    input_path  = "$XDG_CONFIG_HOME/noctalia/templates/waydog-gtk4.css"
    output_path = "$XDG_CONFIG_HOME/gtk-4.0/waydog-colors.css"

    [theme.templates.user.gtksourceview]
    input_path  = "$XDG_CONFIG_HOME/noctalia/templates/gtksourceview-noctalia.xml"
    output_path = "~/.local/share/gtksourceview-4/styles/noctalia.xml"

[wallpaper]
directory = "/usr/share/backgrounds/wallpapers"

    [wallpaper.default]
    path = "/usr/share/backgrounds/wallpapers/Default.jpg"

[bar.default]
start  = ["launcher", "wallpaper", "accent", "workspaces", "taskbar"]
center = []
end    = ["tray", "hotcorners", "notifications", "clipboard", "bluetooth", "volume", "brightness", "battery", "clock", "network", "control-center", "session"]

[widget.accent]
type = "custom_button"
glyph = "brightness"
tooltip = "Accent Tuner"

[widget.accent.actions]
left = "exec accent-tuner"
right = "exec accent-tuner"

[widget.hotcorners]
type = "custom_button"
glyph = "scan-eye"
tooltip = "Left-Click ▸ Hotcorners Toggle - Right-Click ▸ Hotcorners Settings"

    [widget.hotcorners.actions]
    left = "exec hotcorners-toggle"
    right = "exec noctalia msg settings-open desktop"

[hot_corners]
enabled = false

    [hot_corners.bottom_left]
    action = "command"
    command = "x-terminal-emulator"

    [hot_corners.bottom_right]
    action = "command"
    command = "ld-logout"

    [hot_corners.top_left]
    action = "command"
    command = "thunar"

    [hot_corners.top_right]
    action = "command"
    command = "geany"

[hooks]
colors_changed = 'sleep 0.2; accent-tuner --apply'
started = "ghostty-noctalia-fix &"
theme_mode_changed = 'sleep 0.2; accent-tuner --apply'
