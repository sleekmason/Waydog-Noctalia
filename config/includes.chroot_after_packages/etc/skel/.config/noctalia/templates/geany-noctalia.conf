[theme_info]
name=Noctalia
description=Follows Noctalia for the base colors.
version=1
author=sleekmason <sleekmason@gmail.com>
url=
# list of each compatible Geany release version
compat=1.22;1.23;1.23.1;1.24

[named_colors]
fg={{colors.on_surface.default.hex}}
bg={{colors.surface.default.hex}}
dim_fg={{colors.on_surface_variant.default.hex}}
error_red=#f00
selection_fg={{colors.on_primary.default.hex}}
selection_bg={{colors.primary.default.hex}}
current_line_bg={{colors.surface_container.default.hex}}
alert_fg=#fff

brace_bg_good=#236ABB
brace_bg_bad=#aa1515

comment_fg={{colors.on_surface_variant.default.hex}}
comment_doc_fg=#3f5fbf

whitespace={{colors.outline_variant.default.hex}}

dbl_quoted_str_fg=#4BC9D6
sgl_quoted_str_fg=#5FD14B
keywd_fg=#E0A536
param_fg=#B1EB43

[named_styles]
default=fg;bg;false;false
error=error_red;;true;false

# Editor styles
#-------------------------------------------------------------------------------

selection=selection_fg;selection_bg;true;true
current_line=;current_line_bg;true;
brace_good=fg;brace_bg_good;true;false
brace_bad=alert_fg;brace_bg_bad;true;false
margin_line_number=dim_fg;bg
margin_folding=dim_fg;bg
fold_symbol_highlight=fg
indent_guide=whitespace;;;
caret=fg;#000;false
marker_line=#000;#ff0;
marker_search=#000;#0000f0;
marker_mark=#000;#b8f4b8;
call_tips=#555753;#eeeeec
white_space=whitespace;#fff;true;false

# Programming languages
#-------------------------------------------------------------------------------

comment=comment_fg;;;
comment_doc=comment_doc_fg;;;
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=comment_doc,bold
comment_doc_keyword_error=comment_doc_keyword,italic

number=#06a7a7
number_1=number
number_2=number_1

type=#30A2DB
class=type
function=default
parameter=param_fg;;;

keyword=keywd_fg;;;
keyword_1=keyword
keyword_2=#118A11
keyword_3=keyword_1
keyword_4=keyword_1

identifier=default
identifier_1=identifier
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

string=dbl_quoted_str_fg;;;
string_1=string
string_2=string_1
string_3=default
string_4=default
string_eol=#000;#e0c0e0
character=sgl_quoted_str_fg;;;
backticks=#53C738
# here_doc ???
here_doc=#ff84cd

scalar=#bcf360
# label ???
label=default,bold
preprocessor=#acac00
regex=#aaff57
operator=#EBB75B
decorator=preprocessor
other=default
extra=#404080

# Markup-type languages
#-------------------------------------------------------------------------------

tag=type
tag_unknown=tag,italic
tag_end=tag
attribute=keyword
attribute_unknown=attribute,italic
value=string_1
entity=preprocessor

# Diff
#-------------------------------------------------------------------------------

line_added=#34b034
line_removed=#ff2727
line_changed=#7f007f
